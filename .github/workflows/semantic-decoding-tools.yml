name: semantic-decoding-tools

on:
  push:
    branches:
      - research/semantic-decoding
    paths:
      - "experiments/semantic-decoding/**"
      - ".github/workflows/semantic-decoding-tools.yml"
  pull_request:
    paths:
      - "experiments/semantic-decoding/**"
      - ".github/workflows/semantic-decoding-tools.yml"

jobs:
  python-tools:
    name: Python tools (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python tools
        run: >
          python -m py_compile
          experiments/semantic-decoding/tools/run_matrix.py
          experiments/semantic-decoding/tools/summarize_trace.py
          experiments/semantic-decoding/tools/test_trace_tools.py

      - name: Run self-tests
        run: python experiments/semantic-decoding/tools/test_trace_tools.py
